<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="32" height="32" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon shell (pointy-top) -->
  <polygon
    points="24,2 43,13 43,35 24,46 5,35 5,13"
    fill="#3385FF" fill-opacity="0.10"
    stroke="#3385FF" stroke-width="1.5"
    filter="url(#glow)"/>

  <!-- Circuit nodes at hex corners -->
  <g fill="#3385FF" filter="url(#glow)">
    <circle cx="24" cy="2"  r="1.7"/>
    <circle cx="43" cy="13" r="1.7"/>
    <circle cx="43" cy="35" r="1.7"/>
    <circle cx="24" cy="46" r="1.7"/>
    <circle cx="5"  cy="35" r="1.7"/>
    <circle cx="5"  cy="13" r="1.7"/>
  </g>

  <!-- Circuit-trace R letterform -->
  <!-- Vertical stem -->
  <line x1="14" y1="11" x2="14" y2="37"
        stroke="#3385FF" stroke-width="2.6" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Top horizontal bar -->
  <line x1="14" y1="11" x2="25" y2="11"
        stroke="#3385FF" stroke-width="2.1" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Curved bump of R -->
  <path d="M25,11 Q34,11 34,19.5 Q34,28 25,28"
        stroke="#3385FF" stroke-width="2.1" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Middle horizontal bar -->
  <line x1="14" y1="28" x2="25" y2="28"
        stroke="#3385FF" stroke-width="2.1" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Diagonal leg — accent color -->
  <line x1="25" y1="28" x2="34" y2="37"
        stroke="#FF4D79" stroke-width="2.6" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Junction dots at key circuit nodes -->
  <circle cx="14" cy="11" r="2.4" fill="#3385FF" filter="url(#glow)"/>
  <circle cx="25" cy="11" r="1.9" fill="#5599FF"/>
  <circle cx="14" cy="28" r="2.4" fill="#3385FF" filter="url(#glow)"/>
  <circle cx="25" cy="28" r="1.9" fill="#5599FF"/>
  <circle cx="14" cy="37" r="2.0" fill="#3385FF"/>
  <circle cx="34" cy="37" r="2.2" fill="#FF4D79" filter="url(#glow)"/>
</svg>
